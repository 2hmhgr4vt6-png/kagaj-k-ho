name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kagaj
          POSTGRES_PASSWORD: kagaj
          POSTGRES_DB: kagaj_k_ho
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://kagaj:kagaj@localhost:5432/kagaj_k_ho?schema=public
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      ADMIN_SESSION_SECRET: ci-only-secret-value-that-is-long-enough-0123456789
      SEED_ADMIN_EMAIL: admin@example.com
      SEED_ADMIN_PASSWORD: CiAdminPassword!2026

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm run db:seed

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit and integration tests
        run: npm test

      - name: Content validation gate
        run: npm run validate:content

      - name: Build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npx playwright test
        env:
          CI: 'true'
